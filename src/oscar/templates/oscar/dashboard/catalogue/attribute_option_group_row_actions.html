{% load django_tables2 %}
{% load i18n %}
<div class="btn-toolbar">
    <div class="dropdown dropleft">
        <button class="btn btn-secondary dropdown-toggle" type="button" id="attr-opt-group-actions-{{ record.id }}" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            {% trans "Actions" %}
        </button>
        <div class="dropdown-menu" aria-labelledby="attr-opt-group-actions-{{ record.id }}">
            <a class="dropdown-item" href="{% url 'dashboard:catalogue-attribute-option-group-update' pk=record.id %}{% querystring %}">
                {% trans "Edit Attribute Option Group" %}
            </a>
            <a class="dropdown-item" href="{% url 'dashboard:catalogue-attribute-option-group-delete' pk=record.id %}{% querystring %}">
                {% trans "Delete" %}
            </a>
        </div>
    </div>
</div>
